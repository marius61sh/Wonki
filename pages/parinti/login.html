<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Părinți – Wonki</title>
  <link rel="icon" type="image/svg+xml" href="/favicon-parinti.svg">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent:  #918880;
      --accent2: #7a7068;
      --warm:    #F5F3EF;
      --text:    #1A1A18;
      --muted:   #918880;
      --shadow:  0 20px 60px rgba(145, 136, 128, 0.22);
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(135deg, #b0a898 0%, #918880 40%, #7a7068 70%, #a09888 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    /* Decorative blobs */
    body::before {
      content: '';
      position: fixed;
      top: -120px;
      right: -120px;
      width: 350px;
      height: 350px;
      background: rgba(255,255,255,0.12);
      border-radius: 50%;
      pointer-events: none;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -100px;
      left: -100px;
      width: 280px;
      height: 280px;
      background: rgba(255,255,255,0.08);
      border-radius: 50%;
      pointer-events: none;
    }

    .top-brand {
      text-align: center;
      margin-bottom: 28px;
      animation: fadeDown 0.6s ease both;
    }
    .top-brand .logo {
      font-size: 2.6rem;
      font-weight: 900;
      color: #fff;
      letter-spacing: -1px;
      text-shadow: 0 2px 12px rgba(0,0,0,0.15);
    }
    .top-brand .logo span {
      display: inline-block;
      animation: spin 3s linear infinite;
    }
    .top-brand .tagline {
      font-size: 0.95rem;
      color: rgba(255,255,255,0.88);
      font-weight: 600;
      margin-top: 4px;
    }

    .card {
      background: #fff;
      border-radius: 24px;
      padding: 40px 40px 36px;
      width: 100%;
      max-width: 420px;
      box-shadow: var(--shadow);
      animation: fadeUp 0.6s ease 0.1s both;
    }

    .card-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .card-header .icon {
      font-size: 2.8rem;
      display: block;
      margin-bottom: 12px;
      animation: bounce 2s ease-in-out infinite;
    }
    .card-header h1 {
      font-size: 1.55rem;
      font-weight: 900;
      color: var(--text);
      line-height: 1.2;
    }
    .card-header p {
      font-size: 0.88rem;
      color: var(--muted);
      margin-top: 6px;
    }

    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      font-weight: 700;
      font-size: 0.82rem;
      color: var(--text);
      margin-bottom: 7px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .form-group input {
      width: 100%;
      padding: 13px 16px;
      border: 2px solid #F0F0F0;
      border-radius: 12px;
      font-family: 'Nunito', sans-serif;
      font-size: 0.96rem;
      font-weight: 600;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      background: #FAFAFA;
    }
    .form-group input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(255,107,107,0.12);
      background: #fff;
    }
    .form-group input::placeholder {
      color: #BCC;
      font-weight: 400;
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      border: none;
      border-radius: 14px;
      font-family: 'Nunito', sans-serif;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 6px 20px rgba(145,136,128,0.35);
      margin-top: 8px;
    }
    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(145,136,128,0.45);
    }
    .btn-login:active {
      transform: translateY(0);
    }
    .btn-login:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }

    .error-msg {
      display: none;
      background: #FFF0F0;
      border: 1.5px solid #FFCACA;
      border-radius: 10px;
      padding: 11px 14px;
      font-size: 0.86rem;
      font-weight: 700;
      color: #D44;
      margin-bottom: 16px;
      text-align: center;
    }
    .error-msg.show { display: block; }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 22px;
      color: rgba(255,255,255,0.85);
      font-size: 0.88rem;
      font-weight: 700;
      text-decoration: none;
      transition: color 0.2s;
      animation: fadeUp 0.6s ease 0.25s both;
    }
    .back-link:hover { color: #fff; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-5px); }
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    [data-theme="dark"] body { background: #111110; }
    [data-theme="dark"] .top-brand .logo   { color: #e8e0d0; }
    [data-theme="dark"] .top-brand .tagline { color: #9a9080; }
    [data-theme="dark"] .card {
      background: #1e1e18;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    }
    [data-theme="dark"] .card-header h1 { color: #e8e0d0; }
    [data-theme="dark"] .card-header p  { color: #9a9080; }
    [data-theme="dark"] .form-group label { color: #9a9080; }
    [data-theme="dark"] .form-group input {
      background: #141412;
      border: 2px solid rgba(255,255,255,.06);
      color: #e8e0d0;
    }
    [data-theme="dark"] .form-group input:focus {
      border-color: #a08078;
      background: #141412;
      box-shadow: 0 0 0 4px rgba(160,128,120,0.15);
    }
    [data-theme="dark"] .form-group input::placeholder { color: #6a6050; }
    [data-theme="dark"] .btn-login {
      background: linear-gradient(135deg, #a08078, #8a6e66);
      box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    }
    [data-theme="dark"] .error-msg {
      background: #1e1e18;
      border-color: rgba(160,128,120,0.3);
      color: #a08078;
    }
    [data-theme="dark"] .back-link       { color: #9a9080; }
    [data-theme="dark"] .back-link:hover { color: #e8e0d0; }

    .theme-toggle-login {
      position: fixed; top: 16px; right: 16px;
      background: rgba(255,255,255,0.2);
      border: none; border-radius: 50%;
      width: 38px; height: 38px;
      font-size: 1.1rem; cursor: pointer;
      transition: background .2s;
    }
    .theme-toggle-login:hover { background: rgba(255,255,255,0.35); }

    @media (max-width: 480px) {
      .card { padding: 32px 24px 28px; }
    }
  </style>
</head>
<body>

  <button class="theme-toggle-login" id="btn-theme" onclick="toggleTheme()">🌙</button>

  <div class="top-brand">
    <div class="logo">Wonki <span>⭐</span></div>
    <div class="tagline">Unde curiozitatea devine supraputere</div>
  </div>

  <div class="card">
    <div class="card-header">
      <span class="icon">👨‍👩‍👧</span>
      <h1>Portal Părinți</h1>
      <p>Autentifică-te pentru a vedea informații despre copilul tău</p>
    </div>

    <div id="error-msg" class="error-msg"></div>

    <div class="form-group">
      <label>Adresă email</label> 
      <input type="email" id="email" placeholder="user@email.com" autocomplete="email">
    </div>
    <div class="form-group">
      <label>Parolă</label>
      <div style="position:relative">
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" style="padding-right:46px">
        <button type="button" onclick="togglePwd('password','eye-login')" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:1.1rem;padding:4px;line-height:1;color:var(--muted)" id="eye-login"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
    </div>

    <button class="btn-login" id="btn-login" onclick="doLogin()">🔓 Intră în portal</button>

    <p style="text-align:center;margin-top:16px;font-size:.85rem">
      <a href="#" onclick="showForgot(event)" style="color:var(--accent);font-weight:700;text-decoration:underline">Am uitat parola</a>
    </p>
  </div>

  <!-- FORGOT PASSWORD CARD -->
  <div class="card" id="card-forgot" style="display:none;margin-top:16px">
    <div class="card-header">
      <span class="icon">🔑</span>
      <h1>Resetare parolă</h1>
      <p>Introdu emailul și îți trimitem un cod de verificare</p>
    </div>

    <!-- Step 1: email -->
    <div id="step-email">
      <div id="forgot-err" class="error-msg"></div>
      <div class="form-group">
        <label>Email cont</label>
        <input type="email" id="forgot-email" placeholder="user@email.com">
      </div>
      <button class="btn-login" id="btn-forgot" onclick="sendCode()">📨 Trimite codul</button>
    </div>

    <!-- Step 2: cod + parolă nouă -->
    <div id="step-reset" style="display:none">
      <div id="reset-err" class="error-msg"></div>
      <div id="reset-info" style="background:#f0fff4;border:1.5px solid #a3e9b8;border-radius:10px;padding:12px 14px;font-size:.85rem;font-weight:700;color:#2a7a4a;margin-bottom:16px;text-align:center"></div>
      <div class="form-group">
        <label>Cod primit (6 cifre)</label>
        <input type="text" id="reset-code" placeholder="123456" maxlength="6" style="letter-spacing:6px;font-size:1.3rem;text-align:center">
      </div>
      <div class="form-group">
        <label>Parolă nouă</label>
        <div style="position:relative">
          <input type="password" id="new-password" placeholder="min. 6 caractere" style="padding-right:46px">
          <button type="button" onclick="togglePwd('new-password','eye-new')" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:1.1rem;padding:4px;line-height:1;color:var(--muted)" id="eye-new"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
      </div>
      <div class="form-group">
        <label>Confirmă parola nouă</label>
        <div style="position:relative">
          <input type="password" id="confirm-password" placeholder="••••••••" style="padding-right:46px">
          <button type="button" onclick="togglePwd('confirm-password','eye-confirm')" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:1.1rem;padding:4px;line-height:1;color:var(--muted)" id="eye-confirm"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
      </div>
      <button class="btn-login" id="btn-reset" onclick="doReset()">✅ Setează parola nouă</button>
    </div>

    <p style="text-align:center;margin-top:14px;font-size:.84rem">
      <a href="#" onclick="showLogin(event)" style="color:var(--accent);font-weight:700;text-decoration:underline">← Înapoi la login</a>
    </p>
  </div>

  <a href="/" class="back-link">← Înapoi la site</a>

  <script>
    if (localStorage.getItem('wonki_parinte_token')) { window.location.href = '/parinti'; }

    const EYE_OPEN = `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
    const EYE_OFF  = `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;

    function togglePwd(inputId, btnId) {
      const input = document.getElementById(inputId);
      const btn   = document.getElementById(btnId);
      const show  = input.type === 'password';
      input.type   = show ? 'text' : 'password';
      btn.innerHTML = show ? EYE_OFF : EYE_OPEN;
    }

    /* ── DARK MODE ── */
    function applyTheme(t) {
      document.documentElement.setAttribute('data-theme', t);
      document.getElementById('btn-theme').textContent = t === 'dark' ? '☀️' : '🌙';
      localStorage.setItem('wonki-theme', t);
    }
    function toggleTheme() {
      applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    }
    applyTheme(localStorage.getItem('wonki-theme') || 'light');

    document.getElementById('password').addEventListener('keydown', e => {
      if (e.key === 'Enter') doLogin();
    });
    document.getElementById('email').addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('password').focus();
    });

    const cardLogin  = document.querySelector('.card');
    const cardForgot = document.getElementById('card-forgot');

    function showForgot(e) {
      e.preventDefault();
      cardLogin.style.display  = 'none';
      cardForgot.style.display = 'block';
      document.getElementById('step-email').style.display = 'block';
      document.getElementById('step-reset').style.display = 'none';
    }
    function showLogin(e) {
      e.preventDefault();
      cardLogin.style.display  = 'block';
      cardForgot.style.display = 'none';
    }

    async function sendCode() {
      const email  = document.getElementById('forgot-email').value.trim();
      const errEl  = document.getElementById('forgot-err');
      const btn    = document.getElementById('btn-forgot');
      errEl.classList.remove('show');
      if (!email) { errEl.textContent = '⚠️ Introdu emailul.'; errEl.classList.add('show'); return; }
      btn.disabled = true; btn.textContent = '⏳ Se trimite...';
      try {
        const r    = await fetch('/api/parinti/forgot-password', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await r.json();
        btn.disabled = false; btn.textContent = '📨 Trimite codul';
        if (data.ok) {
          document.getElementById('step-email').style.display = 'none';
          document.getElementById('step-reset').style.display = 'block';
          document.getElementById('reset-info').textContent =
            '📧 Codul a fost trimis pe ' + email + '. Verifică și folderul Spam.';
          window._resetEmail = email;
        } else {
          errEl.textContent = '❌ ' + (data.error || 'Eroare.');
          errEl.classList.add('show');
        }
      } catch { btn.disabled = false; btn.textContent = '📨 Trimite codul'; errEl.textContent = '❌ Eroare conexiune.'; errEl.classList.add('show'); }
    }

    async function doReset() {
      const code     = document.getElementById('reset-code').value.trim();
      const newPwd   = document.getElementById('new-password').value;
      const confPwd  = document.getElementById('confirm-password').value;
      const errEl    = document.getElementById('reset-err');
      const btn      = document.getElementById('btn-reset');
      errEl.classList.remove('show');
      if (!code || !newPwd || !confPwd) { errEl.textContent = '⚠️ Completează toate câmpurile.'; errEl.classList.add('show'); return; }
      if (newPwd !== confPwd) { errEl.textContent = '❌ Parolele nu coincid.'; errEl.classList.add('show'); return; }
      btn.disabled = true; btn.textContent = '⏳ Se salvează...';
      try {
        const r    = await fetch('/api/parinti/reset-password', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: window._resetEmail, code, newPassword: newPwd })
        });
        const data = await r.json();
        btn.disabled = false; btn.textContent = '✅ Setează parola nouă';
        if (data.ok) {
          errEl.style.cssText = 'display:block;background:#f0fff4;border-color:#a3e9b8;color:#2a7a4a';
          errEl.textContent = '✅ Parola a fost schimbată! Te poți autentifica acum.';
          setTimeout(() => showLogin({ preventDefault: () => {} }), 2500);
        } else {
          errEl.textContent = '❌ ' + (data.error || 'Eroare.'); errEl.classList.add('show');
        }
      } catch { btn.disabled = false; btn.textContent = '✅ Setează parola nouă'; errEl.textContent = '❌ Eroare conexiune.'; errEl.classList.add('show'); }
    }

    async function doLogin() {
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errEl    = document.getElementById('error-msg');
      const btn      = document.getElementById('btn-login');

      errEl.classList.remove('show');

      if (!email || !password) {
        errEl.textContent = '⚠️ Completează emailul și parola.';
        errEl.classList.add('show');
        return;
      }

      btn.disabled    = true;
      btn.textContent = '⏳ Se verifică...';

      try {
        const r = await fetch('/api/parinti/login', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ email, password })
        });
        const data = await r.json();

        if (data.ok) {
          localStorage.setItem('wonki_parinte_token',    data.data.token);
          localStorage.setItem('wonki_parinte_name',     data.data.name);
          localStorage.setItem('wonki_parinte_copiiIds', JSON.stringify(data.data.copiiIds || []));
          window.location.href = '/parinti';
        } else {
          errEl.textContent = '❌ ' + (data.error || 'Email sau parolă incorectă.');
          errEl.classList.add('show');
          btn.disabled    = false;
          btn.textContent = '🔓 Intră în portal';
        }
      } catch (e) {
        errEl.textContent = '❌ Eroare de conexiune. Încearcă din nou.';
        errEl.classList.add('show');
        btn.disabled    = false;
        btn.textContent = '🔓 Intră în portal';
      }
    }
  </script>
</body>
</html>
