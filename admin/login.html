<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – Wonki Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800;900&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --coral: #FF6B6B; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Quicksand', sans-serif; background: #12121F; color: #E8E8F0; min-height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .blob { position: absolute; border-radius: 50%; filter: blur(80px); opacity: .12; animation: bf 10s ease-in-out infinite alternate; }
    .blob:nth-child(1) { width: 500px; height: 500px; background: #FF6B6B; top: -100px; left: -100px; }
    .blob:nth-child(2) { width: 400px; height: 400px; background: #4D96FF; bottom: -80px; right: -80px; animation-delay: 2s; }
    .blob:nth-child(3) { width: 300px; height: 300px; background: #C77DFF; top: 40%; left: 40%; animation-delay: 1s; }
    @keyframes bf { to { transform: translate(30px, 20px) scale(1.1); } }
    .box { background: #1E1E30; border: 1px solid rgba(255,255,255,.07); border-radius: 24px; padding: 48px 44px; width: 100%; max-width: 420px; position: relative; z-index: 10; box-shadow: 0 24px 80px rgba(0,0,0,.5); animation: bi .6s cubic-bezier(.34,1.56,.64,1) both; }
    @keyframes bi { from { opacity: 0; transform: translateY(30px) scale(.95); } }
    .logo { font-family: 'Baloo 2', cursive; font-size: 2.2rem; font-weight: 900; color: var(--coral); text-align: center; margin-bottom: 0; line-height: 1; }
    .sub  { text-align: center; color: rgba(232,232,240,.45); font-size: .9rem; margin-bottom: 28px; }
    .tag  { display: inline-block; background: rgba(255,107,107,.12); color: var(--coral); font-size: .72rem; font-weight: 700; padding: 3px 10px; border-radius: 50px; }
    .server-bar { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.07); border-radius: 10px; padding: 10px 14px; margin-bottom: 24px; font-size: .8rem; }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .dot.online  { background: #6BCB77; box-shadow: 0 0 6px #6BCB77; }
    .dot.offline { background: #FF6B6B; }
    .dot.checking { background: #FFD93D; animation: blink 1s ease infinite; }
    @keyframes blink { 50%{opacity:.3} }
    .fg { margin-bottom: 18px; }
    .fg label { display: block; font-size: .82rem; font-weight: 700; color: rgba(232,232,240,.45); margin-bottom: 7px; }
    .fg input { width: 100%; padding: 12px 16px; background: #12121F; border: 1.5px solid rgba(255,255,255,.07); border-radius: 12px; color: #E8E8F0; font-family: inherit; font-size: .95rem; outline: none; transition: border-color .2s, box-shadow .2s; }
    .fg input:focus { border-color: var(--coral); box-shadow: 0 0 0 3px rgba(255,107,107,.12); }
    .btn-login { width: 100%; padding: 14px; background: var(--coral); color: #fff; border: none; border-radius: 12px; font-family: 'Baloo 2', cursive; font-size: 1.05rem; font-weight: 800; cursor: pointer; box-shadow: 0 6px 20px rgba(255,107,107,.4); transition: transform .25s, box-shadow .25s; margin-top: 4px; }
    .btn-login:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(255,107,107,.5); }
    .btn-login:disabled { opacity: .6; cursor: not-allowed; }
    .err { background: rgba(255,107,107,.1); border: 1px solid rgba(255,107,107,.2); color: var(--coral); padding: 10px 14px; border-radius: 10px; font-size: .85rem; font-weight: 700; margin-bottom: 16px; display: none; }
    .hint { text-align: center; font-size: .76rem; color: rgba(232,232,240,.22); margin-top: 16px; }
    .back { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 18px; font-size: .83rem; color: rgba(232,232,240,.3); text-decoration: none; transition: color .2s; }
    .back:hover { color: var(--coral); }
  </style>
</head>
<body>
  <div class="blob"></div><div class="blob"></div><div class="blob"></div>
  <div class="box">
    <div class="logo">Wonki ⭐</div>
    <div style="text-align:center;margin-bottom:4px"><span class="tag">ADMIN</span></div>
    <div class="sub">Panoul de administrare</div>

    <div class="server-bar">
      <div class="dot checking" id="sdot"></div>
      <span id="stext">Verificare server...</span>
    </div>

    <div class="err" id="err"></div>
    <div class="fg"><label>Email</label><input type="email" id="email" autocomplete="off"></div>
    <div class="fg"><label>Parolă</label><input type="password" id="pass" autocomplete="new-password"></div>
    <button class="btn-login" id="btn" onclick="doLogin()">🔑 Intră în Admin</button>
    <div class="hint">Login default: admin@wonki.ro / wonki2025</div>
    <a href="/" class="back">← Înapoi la site</a>
  </div>

  <script>
    const API = '/api';

    async function checkServer() {
      try {
        const r = await fetch(API + '/blog', { signal: AbortSignal.timeout(2500) });
        if (r.ok) {
          document.getElementById('sdot').className = 'dot online';
          document.getElementById('stext').textContent = 'Server online ✓ localhost:3000';
          document.getElementById('stext').style.color = '#6BCB77';
        }
      } catch {
        document.getElementById('sdot').className = 'dot offline';
        document.getElementById('stext').innerHTML = 'Server offline — rulează: <code style="background:rgba(255,255,255,.07);padding:1px 6px;border-radius:4px">cd server &amp;&amp; npm start</code>';
        document.getElementById('stext').style.color = '#FF6B6B';
      }
    }
    checkServer();

    // Auto-redirect dacă token valid
    const saved = localStorage.getItem('wonki_token');
    if (saved) {
      fetch(API + '/admin/stats', { headers: { 'Authorization': 'Bearer ' + saved } })
        .then(r => { if (r.ok) window.location.href = 'admin.html'; })
        .catch(() => {});
    }

    async function doLogin() {
      const email = document.getElementById('email').value.trim();
      const pass  = document.getElementById('pass').value;
      const btn   = document.getElementById('btn');
      const errEl = document.getElementById('err');
      errEl.style.display = 'none';
      if (!email || !pass) { showErr('Completează emailul și parola!'); return; }
      btn.textContent = '⏳ Se conectează...'; btn.disabled = true;
      try {
        const res  = await fetch(API + '/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password: pass })
        });
        const data = await res.json();
        if (!res.ok || !data.ok) { showErr(data.error || 'Eroare necunoscută'); }
        else {
          localStorage.setItem('wonki_token', data.data.token);
          localStorage.setItem('wonki_name',  data.data.name);
          window.location.href = 'admin.html';
        }
      } catch { showErr('Nu pot contacta serverul. Pornește: cd server && npm start'); }
      btn.textContent = '🔑 Intră în Admin'; btn.disabled = false;
    }

    function showErr(msg) { const e=document.getElementById('err'); e.textContent='❌ '+msg; e.style.display='block'; }
    document.addEventListener('keydown', e => { if (e.key==='Enter') doLogin(); });
  </script>
</body>
</html>
